plugins { id 'com.android.application' }

def localBackend = providers.gradleProperty('greenmineLocal').getOrElse('false').toBoolean()
def previewIdentity = providers.gradleProperty('greenminePreviewIdentity').getOrElse('true').toBoolean()

def serverUrl = providers.gradleProperty('greenmineUrl').getOrElse('https://greenmineapp.ir')
if (serverUrl && !(serverUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9_\/-]*)?/)) {
    throw new GradleException('greenmineUrl must be an HTTPS URL without query parameters or credentials.')
}
android {
    namespace 'ir.greenmine.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.greenmine.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.3.1'
        testInstrumentationRunner 'ir.greenmine.app.DeviceSmokeTest'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            applicationIdSuffix localBackend && previewIdentity ? '.preview' : '.debug'
            versionNameSuffix localBackend ? '-preview' : '-connected'
            manifestPlaceholders = [appLabel: localBackend && previewIdentity ? 'GreenMine Preview' : 'GreenMine']
            buildConfigField 'String', 'SERVER_URL', '"' + (localBackend ? 'http://localhost:3000' : serverUrl) + '"'
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'GreenMine']
            buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!serverUrl) throw new GradleException('Release requires an HTTPS greenmineUrl.')
        }
    }
}
