plugins { id 'com.android.application' }

def serverUrl = providers.gradleProperty('greenmineUrl').getOrElse('')
if (serverUrl && !(serverUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9_\/-]*)?/)) {
    throw new GradleException('greenmineUrl must be an HTTPS URL without query parameters or credentials.')
}
android {
    namespace 'ir.greenmine.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.greenmine.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'ir.greenmine.app.DeviceSmokeTest'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-usb'
            buildConfigField 'String', 'SERVER_URL', '"' + (serverUrl ?: 'http://127.0.0.1:3000') + '"'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!serverUrl) throw new GradleException('Release needs -PgreenmineUrl=https://your-host. Debug uses USB localhost.')
        }
    }
}
