services:
  app:
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file:
      - path: ${GREENMINE_SMTP_ENV_FILE:-/opt/greenmine/config/mail.env}
        required: false
    environment:
      APP_ORIGIN: https://${GREENMINE_DOMAIN:?Set the approved domain}
      GREENMINE_ADMIN_EMAIL: ${GREENMINE_ADMIN_EMAIL:-}
      SMTP_REQUIRE_SETUP: ${SMTP_REQUIRE_SETUP:-1}
    volumes:
      - greenmine_accounts:/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GREENMINE_DOMAIN: ${GREENMINE_DOMAIN:?Set the approved domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  greenmine_accounts:
  caddy_data:
  caddy_config:
